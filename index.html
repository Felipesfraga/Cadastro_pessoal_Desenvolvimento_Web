<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Minha Pagina</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">
        <h1>Meu Perfil</h1>

        <!-- FOTO DO ALUNO -->

        <img src="minhafoto.jpeg" alt="Minha fotografia" class="foto">

        <h2> Cadastro pessoal</h2>

        <form id="formulario">
            
            <label  for="nome">Nome: </label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

            <label for="endereco">Endereço: </label>
            <input type="text" id="endereco" name="endereco" placeholder="Digite seu Endereço" required>

            <label for="telefone">Telefone: </label>
            <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999" required>

            <label for="email">E-mail: </label>
            <input type="email" id="email" name="email" placeholder="seuemail@email.com" required>

            <label for="nacionalidade">Nacionalidade: </label>
            <input type="text" id="nacionalidade" name="nacionalidade" placeholder="Ex.: Brasileira" required>
            
            <label for="naturalidade">Naturalidade: </label>
            <input type="text" id="naturalidade" name="naturalidade" placeholder="Ex.: São paulo - SP" required>

            <button type="submit">

                Enviar Cadastro

            </button>

            <button type="button" onclick="limparFormulario()">

                Limpar

            </button>

            <p id="mensagem"></p>

                            <!-- CSS -->
            <link rel="stylesheet" href="style.css">

                            <!-- JavaScript -->
            <script src="script.js"></script>

        </form>
      </div>
   </body> 

</html>
